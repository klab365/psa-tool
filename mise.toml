[tools]
rust = "1.98.1"

[tasks.install]
description = "Installiert die psa-Binary mit dem von mise verwalteten Rust-Toolchain"
run = "cargo install --path . --locked"

[tasks.check]
description = "Prüft Rust-Formatierung, Lints, Tests, Build und Git-Diff"
run = """
cargo fmt --check
cargo clippy --locked --all-targets -- -D warnings
cargo test --locked
cargo build --locked --release
git diff --check
"""
